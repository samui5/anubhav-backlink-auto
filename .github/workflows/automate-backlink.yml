name: Backlink Automation

# ubuntu-latest is a GitHub-hosted runner — free and unlimited for public
# repos (2,000 free minutes/month even on a private repo, but no limit at
# all on a public one). Nothing here needs a paid runner or self-hosting.
on:
  # Manual "Run workflow" button in the Actions tab. Optional inputs let you
  # override the target/keywords/browsers for a single run without editing
  # any files.
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to submit (overrides config/settings.js for this run)'
        required: false
        type: string
      keywords:
        description: 'Comma-separated keywords (overrides config/settings.js for this run)'
        required: false
        type: string
      browsers:
        description: 'Comma-separated browser engines to run (Opera is unreliable on GitHub-hosted runners — see below)'
        required: false
        type: string
        default: 'chrome,edge,chromium,firefox'
      limit:
        description: 'Only process the first N sites (leave blank for all)'
        required: false
        type: string

  # Runs automatically on a schedule (cron is UTC — GitHub Actions has no
  # timezone option, so IST (UTC+5:30) is converted by hand below). Every
  # run's report is emailed at the end regardless of trigger (see the
  # GMAIL_APP_PASSWORD env var below and src/mailer.js) since scheduled runs
  # are unattended.
  schedule:
    - cron: '30 20 * * *' # every night at 02:00 IST (20:30 UTC the previous day)

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright's Chromium + Firefox (with OS deps)
        run: npx playwright install --with-deps chromium firefox

      - name: Install Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb

      - name: Install Microsoft Edge
        run: |
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge-keyring.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge-keyring.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable

      # Opera is deliberately NOT installed here: confirmed in production runs
      # on this exact runner to fail every launch with "Opera never opened
      # its DevTools port in time" (same failure mode already documented for
      # Docker Desktop/WSL2 in the Dockerfile and src/browsers.js) — Chrome,
      # Edge, Playwright's bundled Chromium, and Firefox are the four
      # verified-reliable engines in this headless Linux environment. Pass
      # browsers: chrome,edge,chromium,firefox,opera on a manual dispatch if
      # you want to try Opera anyway, but expect it to fail.

      - name: Run the automation (headless)
        env:
          CI: 'true' # already set by GitHub Actions; makes chromiumArgs add --no-sandbox etc.
          TARGET_URL: ${{ inputs.target_url }}
          PING_KEYWORDS: ${{ inputs.keywords }}
          # Report email (config/settings.js -> email / src/mailer.js), sent
          # at the end of every run. Add GMAIL_APP_PASSWORD as a repo secret
          # (Settings -> Secrets and variables -> Actions) -- generate it at
          # https://myaccount.google.com/apppasswords for wednesday.ui5@gmail.com
          # (requires 2-Step Verification on that account). Leaving the
          # secret unset just skips the email; it doesn't fail the run.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # inputs.browsers only exists on a manual (workflow_dispatch) run —
          # it's empty on the schedule trigger, so default to the same four
          # verified-reliable engines there too (see the comment above the
          # Opera install step).
          BROWSERS="${{ inputs.browsers }}"
          if [ -z "$BROWSERS" ]; then BROWSERS="chrome,edge,chromium,firefox"; fi
          ARGS="--headless --only=$BROWSERS"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ inputs.limit }}"; fi
          node index.js $ARGS

      - name: Upload run report
        if: always() # keep the report even if the run above exits non-zero
        uses: actions/upload-artifact@v4
        with:
          name: backlink-run-report
          path: logs/
          retention-days: 30
